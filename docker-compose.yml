version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carbonx_backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=CarbonX Platform API
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/carbonx
      - SYNC_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/carbonx
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=carbonx-super-secret-production-key-for-auth-token-2026
      - ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: carbonx_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=carbonx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: carbonx_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
